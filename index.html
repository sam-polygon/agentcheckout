document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n Open Money Stack<\u002Fspan>\n  <h1>Agent Checkout<\u002Fh1>\n  <p class=\"lede\">Let your customers' agents pay anywhere online with a card saved in your app or in stablecoins. OMS holds the card in its PCI DSS vault and runs checkout, provides agent with a wallet, the shopper sets the agent's budget once, and the merchant gets an ordinary card payment. The agent routes each payment to the rail that fits: card or a stablecoin payment. No new balance, no new license, and no card data in your app or the agent.<\u002Fp>\n<\u002Fheader>\n\n<section class=\"panel\" aria-labelledby=\"val-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"val-h\">What it adds<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"split\">\n    <div class=\"card hl\">\n      <h3>For payment providers<\u002Fh3>\n      <ul>\n        <li>Agent checkout for your customers at any merchant, on or off your network<\u002Fli>\n        <li>Wallet infrastructure included: a non-custodial stablecoin wallet for each shopper, embedded in your app, with OMS ramps behind it<\u002Fli>\n        <li>One API or SDK: OMS runs the card vault, the wallet, the checkout browsers, and the routing<\u002Fli>\n        <li>Your brand on the card form, budget, top-up, and approval screens<\u002Fli>\n        <li>Routing per payment: network token first, browser checkout when a merchant can't take one, stablecoins where a card doesn't fit<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div class=\"stack\">\n    <div class=\"card\">\n      <h3>For shoppers<\u002Fh3>\n      <p>Save a card once and approve a budget: an amount and where it can be spent. The agent never sees the card, and the shopper never handles stablecoins.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h3>For merchants and services<\u002Fh3>\n      <p>Card merchants get ordinary card payments through their existing checkout, with standard chargeback rights. APIs, agents, and services can be paid in stablecoins, down to fractions of a cent per call.<\u002Fp>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"panel\" aria-labelledby=\"run-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"run-h\">How a purchase runs<\u002Fh2>\n    <p>The card is saved once and the shopper approves the agent's budget. Purchases inside the budget are completed by OMS without the agent touching payment details, on whichever rail fits each payee. Anything outside it goes to the shopper first.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"rfd\" id=\"rfd\" role=\"img\" aria-label=\"What the shopper sees after their agent shopped three times. The saved Visa ending 4242 is in the OMS card vault, and the agent wallet in your app holds a $47.52 stablecoin balance. The rain jacket for $36.50 fell inside the weekly agent budget, which has $77.02 left. The Checkout API shows three approved payments: trail shoes for $84 with a network token (path A), the rain jacket through an ordinary web checkout where the vault swaps in the real card (path B), and 1,240 API calls for $2.48 paid in stablecoins from the wallet balance (path C).\"><\u002Fdiv>\n<script>\n(function(){\nvar root=document.getElementById('rfd');if(!root)return;\nvar D={\"css\": \"\\n@layer stageshow{\\n.ss-fit { position: relative; width: 100%; margin-inline: auto; }\\n}\\n@layer stageshow{\\n.ss-stage { --ss-canvas: #f6f5f4; --ss-surface: #fff; --ss-chrome: #fff; --ss-ink-1: rgba(0, 0, 0, 0.04); --ss-ink-2: rgba(0, 0, 0, 0.06); --ss-ink-3: rgba(0, 0, 0, 0.08); --ss-fill: #ebebeb; --ss-ink-4: rgba(0, 0, 0, 0.1); --ss-ink-5: rgba(0, 0, 0, 0.15); --ss-line: rgba(0, 0, 0, 0.06); --ss-line-faint: rgba(0, 0, 0, 0.04); --ss-text: #7a7a7d; --ss-text-strong: #262628; --ss-text-faint: #9a9a9d; --ss-icon: #707074; --ss-icon-faint: #c4c4c7; --ss-accent: #3b82f6; --ss-accent-soft: rgba(59, 130, 246, 0.12); --ss-success: #22c55e; --ss-danger: #ef4444; --ss-warning: #f59e0b; --ss-well: #efeeec; --ss-success-soft: rgba(34, 197, 94, 0.12); --ss-success-text: #15803d; --ss-da s=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--ink\\\"><span class=\\\"rf-letter\\\">A<\\/span><\\/span><span class=\\\"rf-head__text\\\"><strong>Token-ready merchant<\\/strong><span>Paid with a network token<\\/span><\\/span><\\/span><span class=\\\"rf-badge rf-badge--success rf-pop rf-tag\\\" data-in=\\\"true\\\">Paid $84.00<\\/span><\\/div><div class=\\\"rf-box rf-path\\\" data-active=\\\"true\\\" style=\\\"left: 836px; top: 200px; width: 240px; height: 104px;\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--ink\\\"><span class=\\\"rf-letter\\\">B<\\/span><\\/span><span class=\\\"rf-head__text\\\"><strong>Any web checkout<\\/strong><span>The merchant's own form<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\" data-on=\\\"true\\\">Browser<\\/span><span class=\\\"rf-arrow\\\">→<\\/span><span class=\\\"rf-chip\\\" data-on=\\\"true\\\">Vault<\\/span><span class=\\\"rf-arrow\\\">→<\\/span><span class=\\\"rf-chip\\\" data-on=\\\"true\\\">Store<\\/span><\\/div><span class=\\\"rf-badge rf-badge--success rf-pop rf-tag\\\" data-in=\\\"true\\\">Paid $36.50<\\/span><\\/div><div class=\\\"rf-box rf-path\\\" data-active=\\\"true\\\" style=\\\"left: 836px; top: 344px; width: 240px; height: 64px;\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--emerald\\\"><span class=\\\"rf-letter\\\">C<\\/span><\\/span><span class=\\\"rf-head__text\\\"><strong>Stablecoin payee<\\/strong><span>Paid from the wallet balance<\\/span><\\/span><\\/span><span class=\\\"rf-badge rf-badge--success rf-pop rf-tag\\\" data-in=\\\"true\\\">Paid $2.48<\\/span><\\/div><div class=\\\"rf-group rf-vault-g\\\" style=\\\"left: 44px; top: 452px; width: 1032px;\\\"><p class=\\\"rf-group__label\\\">OMS card vault<\\/p><div class=\\\"rf-vrow\\\"><div class=\\\"rf-box\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--orange\\\"><svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"15\\\" height=\\\"15\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-lock\\\"><rect width=\\\"18\\\" height=\\\"11\\\" x=\\\"3\\\" y=\\\"11\\\" rx=\\\"2\\\" ry=\\\"2\\\"><\\/rect><path d=\\\"M7 11V7a5 5 0 0 1 10 0v4\\\"><\\/path><\\/svg><\\/span><span class=\\\"rf-head__text\\\"><strong>Vault<\\/strong><span>Holds Visa •••• 4242<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\">Only placeholders leave it<\\/span><\\/div><\\/div><div class=\\\"rf-box\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--orange\\\"><svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"15\\\" height=\\\"15\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-key-round\\\"><path d=\\\"M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z\\\"><\\/path><circle cx=\\\"16.5\\\" cy=\\\"7.5\\\" r=\\\".5\\\" fill=\\\"currentColor\\\"><\\/circle><\\/svg><\\/span><span class=\\\"rf-head__text\\\"><strong>Network token<\\/strong><span>One-time code per purchase<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\">Path A<\\/span><\\/div><\\/div><div class=\\\"rf-box\\\"><span class=\\\"rf-head\\\"><span class=\\\"rf-tile rf-tile--orange\\\"><svg xmlns=\\\"http://www.w3.org/2000/svg\\\" width=\\\"15\\\" height=\\\"15\\\" viewBox=\\\"0 0 24 24\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\" class=\\\"lucide lucide-shuffle\\\"><path d=\\\"m18 14 4 4-4 4\\\"><\\/path><path d=\\\"m18 2 4 4-4 4\\\"><\\/path><path d=\\\"M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22\\\"><\\/path><path d=\\\"M2 6h1.972a4 4 0 0 1 3.6 2.2\\\"><\\/path><path d=\\\"M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45\\\"><\\/path><\\/svg><\\/span><span class=\\\"rf-head__text\\\"><strong>Payment proxy<\\/strong><span>Swaps in the real card<\\/span><\\/span><\\/span><div class=\\\"rf-chips\\\"><span class=\\\"rf-chip\\\">Path B<\\/span><\\/div><\\/div><\\/div><\\/div><\\/div><\\/div><\\/div>\"};\nvar st=document.createElement('style');st.textContent=D.css;root.appendChild(st);\nvar h=document.createElement('div');h.className='rfd-stage';h.innerHTML=D.html;root.appendChild(h);\nvar W=1120,H=624;\nfunction fit(){var cw=root.clientWidth;var s=Math.min(cw/W,1.25);h.style.transform='translateX('+Math.max(0,(cw-W*s)/2)+'px) scale('+s+')';root.style.height=(H*s)+'px';}\nfit();if(window.ResizeObserver)new ResizeObserver(fit).observe(root);else window.addEventListener('resize',fit);\n})();\n<\u002Fscript>\n  <ol class=\"steps\">\n    <li><span class=\"where\">Your app<\u002Fspan><h3>Save a card, approve a budget<\u002Fh3><p>The card goes from secure fields straight to the OMS vault. The shopper approves an amount and where it can be spent. For stablecoin spend, the card tops up the agent wallet in one charge.<\u002Fp><\u002Fli>\n    <li><span class=\"where\">Agent<\u002Fspan><h3>Build the cart<\u002Fh3><p>The agent finds the item and prepares checkout, with no payment access.<\u002Fp><\u002Fli>\n    <li><span class=\"where\">OMS<\u002Fspan><h3>Check the budget<\u002Fh3><p>Merchant, items, address, and amount are checked against the budget the shopper set. Anything outside it asks the shopper first.<\u002Fp><\u002Fli>\n    <li><span class=\"where\">OMS<\u002Fspan><h3>Route and pay<\u002Fh3><p>Network token where the merchant takes one. Otherwise an isolated browser fills the merchant's form and the vault swaps in the real card. Stablecoin payees are paid from the wallet balance.<\u002Fp><\u002Fli>\n    <li><span class=\"where\">Your app<\u002Fspan><h3>Receipt<\u002Fh3><p>The shopper sees the verified result. An unclear result is checked before anything is retried.<\u002Fp><\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<section class=\"panel break\" aria-labelledby=\"sys-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"sys-h\">How it works<\u002Fh2>\n    <p>Agent payments have two legs, and they don't have to use the same rail. Your app keeps the customer and the brand. OMS runs the budget, the card vault, the agent wallet, the checkout browsers, and the routing behind one API or SDK, and the vault is the only place the real card number lives.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"two\">\n    <div class=\"card\">\n      <h3>Leg 1: shopper to agent<\u002Fh3>\n      <p>What the shopper trusts. Mostly the card they already use, for its points and protections. The shopper approves a budget once and never handles stablecoins; OMS handles the card-to-stablecoin ramp behind the scenes.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card hl\">\n      <h3>Leg 2: agent to payee<\u002Fh3>\n      <p>The path of least resistance, picked by OMS for each payment:<\u002Fp>\n      <ul>\n        <li><strong>Card<\u002Fstrong> where the merchant takes cards: network token first, browser checkout as fallback<\u002Fli>\n        <li><strong>Stablecoins<\u002Fstrong> where the payee doesn't take cards, where the amount is too small for a card, or where the agent is spending its wallet balance<\u002Fli>\n        <li><strong>Later:<\u002Fstrong> stablecoins where a merchant chooses them to save on interchange<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"diagram\" tabindex=\"0\" role=\"region\" aria-label=\"Architecture diagram, scrolls sideways on small screens\">\n  <svg viewBox=\"0 0 1000 640\" role=\"img\" aria-labelledby=\"d-t d-d\">\n    <title id=\"d-t\">Agent Checkout: architecture<\u002Ftitle>\n    <desc id=\"d-d\">The shopper enters a card once in secure fields in your app; the card number goes straight to the OMS card vault and your app keeps a reference. The agent sends a checkout request to the Open Money Stack checkout API, which binds the merchant, cart, and amount. The budget gate checks the total against the budget the shopper set and asks the shopper only when a purchase falls outside it. OMS tries a network token first: at a merchant that accepts agentic network tokens, the vault supplies a network token and one-time code. Only if that isn't possible, an isolated, secure browser fills the merchant's form with placeholders and the vault's payment proxy swaps in the real card on the way to the merchant's processor. For payees that take stablecoins, the checkout API pays from the shopper's non-custodial stablecoin wallet, which OMS provides inside your app and the saved card tops up.<\u002Fdesc>\n    <defs>\n      <marker id=\"m-s\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#64708f\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"m-p\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto-start-reverse\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#670de5\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"m-g\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#10b981\"><\u002Fpath><\u002Fmarker>\n      <marker id=\"m-o\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8 Z\" fill=\"#d97706\"><\u002Fpath><\u002Fmarker>\n    <\u002Fdefs>\n\n    <rect x=\"40\" y=\"16\" width=\"205\" height=\"60\" rx=\"10\" class=\"b-actor\"><\u002Frect>\n    <text x=\"56\" y=\"42\" class=\"t-label t-inv\">Shopper<\u002Ftext>\n    <text x=\"56\" y=\"63\" class=\"t-inv-s\">Sets the agent budget<\u002Ftext>\n    <rect x=\"715\" y=\"16\" width=\"205\" height=\"60\" rx=\"10\" class=\"b-actor\"><\u002Frect>\n    <text x=\"731\" y=\"42\" class=\"t-label t-inv\">Agent<\u002Ftext>\n    <text x=\"731\" y=\"63\" class=\"t-inv-s\">Never sees the card<\u002Ftext>\n\n    <rect x=\"20\" y=\"100\" width=\"920\" height=\"124\" rx=\"12\" class=\"b-band-cko\"><\u002Frect>\n    <text x=\"922\" y=\"123\" class=\"t-band s\" text-anchor=\"end\">Your app<\u002Ftext>\n    <rect x=\"40\" y=\"134\" width=\"205\" height=\"72\" rx=\"8\" class=\"b-cko\"><\u002Frect>\n    <text x=\"56\" y=\"162\" class=\"t-label\">Card form<\u002Ftext>\n    <text x=\"56\" y=\"184\" class=\"t-small\">Secure fields, no card data<\u002Ftext>\n    <rect x=\"260\" y=\"134\" width=\"210\" height=\"72\" rx=\"8\" class=\"b-oms-hl\"><\u002Frect>\n    <text x=\"276\" y=\"162\" class=\"t-label\">Budget and top-up<\u002Ftext>\n    <text x=\"276\" y=\"184\" class=\"t-small\">Amount, where it can spend<\u002Ftext>\n    <rect x=\"485\" y=\"134\" width=\"195\" height=\"72\" rx=\"8\" class=\"b-cko\"><\u002Frect>\n    <text x=\"501\" y=\"162\" class=\"t-label\">Customer identity<\u002Ftext>\n    <text x=\"501\" y=\"184\" class=\"t-small\">Your sign-in, your customer<\u002Ftext>\n    <rect x=\"695\" y=\"134\" width=\"225\" height=\"72\" rx=\"8\" class=\"b-oms-hl\"><\u002Frect>\n    <text x=\"711\" y=\"162\" class=\"t-label\">Agent wallet<\u002Ftext>\n    <text x=\"711\" y=\"184\" class=\"t-small\">Stablecoins, non-custodial, by OMS<\u002Ftext>\n    <path d=\"M142 76 V130\" class=\"w\" marker-end=\"url(#m-s)\"><\u002Fpath>\n\n    <rect x=\"20\" y=\"250\" width=\"920\" height=\"270\" rx=\"12\" class=\"b-band-oms\"><\u002Frect>\n    <text x=\"38\" y=\"273\" class=\"t-band p\">Open Money Stack<\u002Ftext>\n    <rect x=\"40\" y=\"284\" width=\"270\" height=\"64\" rx=\"8\" class=\"b-oms-hl\"><\u002Frect>\n    <text x=\"56\" y=\"310\" class=\"t-label\">Isolated, secure browser<\u002Ftext>\n    <text x=\"56\" y=\"332\" class=\"t-small\">One session per purchase<\u002Ftext>\n    <rect x=\"330\" y=\"284\" width=\"270\" height=\"64\" rx=\"8\" class=\"b-oms\"><\u002Frect>\n    <text x=\"346\" y=\"310\" class=\"t-label\">Budget gate<\u002Ftext>\n    <text x=\"346\" y=\"332\" class=\"t-small\">Checks each total against the budget<\u002Ftext>\n    <rect x=\"620\" y=\"284\" width=\"300\" height=\"64\" rx=\"8\" class=\"b-oms\"><\u002Frect>\n    <text x=\"636\" y=\"310\" class=\"t-label\">Checkout API<\u002Ftext>\n    <text x=\"636\" y=\"332\" class=\"t-small\">Binds merchant, cart, and amount<\u002Ftext>\n\n    <path d=\"M920 46 H968 V316 H926\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <text x=\"975\" y=\"130\" class=\"t-edge\" transform=\"rotate(90 975 130)\">checkout request<\u002Ftext>\n    <path d=\"M620 316 H606\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <path d=\"M330 316 H316\" class=\"w-p\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <path d=\"M400 280 V210\" class=\"w-p\" marker-start=\"url(#m-p)\" marker-end=\"url(#m-p)\"><\u002Fpath>\n    <text x=\"409\" y=\"240\" class=\"t-edge\">exact total checked<\u002Ftext>\n    <path d=\"M807 210 V280\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <text x=\"815\" y=\"240\" class=\"t-edge\">spends the balance<\u002Ftext>\n    <text x=\"16\" y=\"240\" class=\"t-edge\">card number goes straight to the vault<\u002Ftext>\n\n    <rect x=\"32\" y=\"392\" width=\"700\" height=\"116\" rx=\"10\" class=\"b-band-vault\"><\u002Frect>\n    <text x=\"716\" y=\"413\" class=\"t-band o\" text-anchor=\"end\">Card vault, run by OMS<\u002Ftext>\n    <path d=\"M40 170 H8 V456 H44\" class=\"w-o\" marker-end=\"url(#m-o)\"><\u002Fpath>\n    <path d=\"M250 348 V372 H548 V420\" class=\"w-o\" marker-end=\"url(#m-o)\"><\u002Fpath>\n    <text x=\"314\" y=\"366\" class=\"t-edge\">placeholders only<\u002Ftext>\n    <rect x=\"48\" y=\"424\" width=\"312\" height=\"64\" rx=\"8\" class=\"b-vgs\"><\u002Frect>\n    <text x=\"64\" y=\"450\" class=\"t-label\">Vault<\u002Ftext>\n    <text x=\"64\" y=\"472\" class=\"t-small\">PCI DSS, card and network token<\u002Ftext>\n    <rect x=\"380\" y=\"424\" width=\"336\" height=\"64\" rx=\"8\" class=\"b-vgs\"><\u002Frect>\n    <text x=\"396\" y=\"450\" class=\"t-label\">Payment proxy<\u002Ftext>\n    <text x=\"396\" y=\"472\" class=\"t-small\">Swaps placeholders for the real card<\u002Ftext>\n\n    <path d=\"M180 488 V556\" class=\"w-o\" marker-end=\"url(#m-o)\"><\u002Fpath>\n    <text x=\"188\" y=\"540\" class=\"t-edge\">network token, one-time code<\u002Ftext>\n    <path d=\"M548 488 V556\" class=\"w-o\" marker-end=\"url(#m-o)\"><\u002Fpath>\n    <text x=\"556\" y=\"540\" class=\"t-edge\">real card, to processor<\u002Ftext>\n    <path d=\"M807 348 V556\" class=\"w-g\" marker-end=\"url(#m-g)\"><\u002Fpath>\n    <text x=\"815\" y=\"440\" class=\"t-edge\">stablecoin payment<\u002Ftext>\n\n    <rect x=\"40\" y=\"560\" width=\"290\" height=\"64\" rx=\"10\" class=\"b-rail\"><\u002Frect>\n    <rect x=\"56\" y=\"580\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"68\" y=\"597\" class=\"rail-key-t\" text-anchor=\"middle\">A<\u002Ftext>\n    <text x=\"90\" y=\"588\" class=\"t-label\">Token-ready merchant<\u002Ftext>\n    <text x=\"90\" y=\"608\" class=\"t-small\">First choice, no browser session<\u002Ftext>\n    <rect x=\"350\" y=\"560\" width=\"300\" height=\"64\" rx=\"10\" class=\"b-rail\"><\u002Frect>\n    <rect x=\"366\" y=\"580\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"378\" y=\"597\" class=\"rail-key-t\" text-anchor=\"middle\">B<\u002Ftext>\n    <text x=\"400\" y=\"588\" class=\"t-label\">Any web checkout<\u002Ftext>\n    <text x=\"400\" y=\"608\" class=\"t-small\">Fallback, the merchant's own form<\u002Ftext>\n    <rect x=\"670\" y=\"560\" width=\"250\" height=\"64\" rx=\"10\" class=\"b-iss\"><\u002Frect>\n    <rect x=\"686\" y=\"580\" width=\"24\" height=\"24\" rx=\"6\" class=\"rail-key\"><\u002Frect><text x=\"698\" y=\"597\" class=\"rail-key-t\" text-anchor=\"middle\">C<\u002Ftext>\n    <text x=\"720\" y=\"588\" class=\"t-label\">Stablecoin payee<\u002Ftext>\n    <text x=\"720\" y=\"608\" class=\"t-small\">APIs, agents, services<\u002Ftext>\n  <\u002Fsvg>\n  <\u002Fdiv>\n  <div class=\"legend\">\n    <span><i class=\"sw cko\"><\u002Fi>Your app<\u002Fspan>\n    <span><i class=\"sw oms\"><\u002Fi>Open Money Stack<\u002Fspan>\n    <span><i class=\"sw vgs\"><\u002Fi>OMS card vault<\u002Fspan>\n    <span><i class=\"ln cdata\"><\u002Fi>Card data<\u002Fspan>\n    <span><i class=\"ln ctrl\"><\u002Fi>Agent request and budget check<\u002Fspan>\n    <span><i class=\"ln money\"><\u002Fi>Stablecoin payment<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"facts\">\n    <div><h3>No card data in your app or the agent<\u002Fh3><p>Card numbers go from secure fields straight to the PCI DSS vault OMS runs. Your app and the rest of OMS keep only references, the browser only sees placeholders, and card security codes are never stored.<\u002Fp><\u002Fdiv>\n    <div><h3>Every purchase inside the budget<\u002Fh3><p>OMS checks each payment's payee, cart, amount, and address against the budget the shopper approved, whichever rail it uses, and anything outside it goes to the shopper first. The agent can't broaden the budget, and issuer checks such as 3-D Secure still apply.<\u002Fp><\u002Fdiv>\n    <div><h3>One secure session, one attempt<\u002Fh3><p>Card payments move on normal card rails and never pass through OMS or the vault. Stablecoin payments come from the shopper's own non-custodial wallet, so neither you nor OMS holds the balance. Each browser checkout runs in its own short-lived, isolated session.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"panel\" aria-labelledby=\"why-h\">\n  <div class=\"panel-head\">\n    <h2 id=\"why-h\">More than a card vault<\u002Fh2>\n    <p>A vault keeps card data safe. The value OMS adds is deciding how each agent payment should move, and giving the agent a second rail when a card isn't the right one.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"three\">\n    <div class=\"card\"><h3>Routing<\u002Fh3><p>Every payment goes the cheapest way that works: network token, browser checkout, or stablecoins, inside one budget the shopper approved.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3>A second rail<\u002Fh3><p>Payees that don't take cards, and payments too small for a card, are paid from the agent wallet in stablecoins, down to fractions of a cent per call.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3>Wallet infrastructure<\u002Fh3><p>If you don't run a wallet, OMS provides one: non-custodial, embedded in your app under your brand, with ramps from card, bank, or stablecoins.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>"
  </script>
